name: Release

on:
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Release branch commit SHA that already passed Tests and Security
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read

jobs:
  prepare:
    name: Prepare release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.event_name == 'workflow_dispatch'
    outputs:
      ready: ${{ steps.final-target.outputs.ready }}
      sha: ${{ steps.checked-commit.outputs.sha }}
    steps:
      - name: Resolve checked commit
        id: checked-commit
        env:
          VERIFIED_SHA_INPUT: ${{ inputs.verified_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.ref_name }}" != "release" ]; then
            echo "Manual releases must be dispatched from the release branch."
            exit 1
          fi

          if [ -z "$VERIFIED_SHA_INPUT" ]; then
            echo "verified_sha is required. Release must be dispatched after Tests and Security pass."
            exit 1
          fi

          checked_sha="$VERIFIED_SHA_INPUT"
          if [[ ! "$checked_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected a full 40-character release commit SHA, got: $checked_sha"
            exit 1
          fi

          echo "sha=$checked_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: release

      - name: Ensure release points to the checked commit
        id: release-target
        shell: bash
        run: |
          current_sha="$(git rev-parse HEAD)"
          checked_sha="${{ steps.checked-commit.outputs.sha }}"

          if [ "$current_sha" != "$checked_sha" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release because release moved to $current_sha after workflow started for $checked_sha."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify Tests and Security succeeded for the checked commit
        if: steps.release-target.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECKED_SHA: ${{ steps.checked-commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          verify_workflow() {
            local workflow_name="$1"
            local association_filter="$2"
            local runs_endpoint="$3"
            local attempt
            local active_runs
            local successful_runs

            for attempt in $(seq 1 12); do
              successful_runs="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "$runs_endpoint" \
                  --jq "[.workflow_runs[] | select(($association_filter) and .status == \"completed\" and .conclusion == \"success\")] | length"
              )"

              if [ "$successful_runs" -ge 1 ]; then
                echo "$workflow_name has a successful run for $CHECKED_SHA."
                return
              fi

              active_runs="$(
                gh api \
                  -H "Accept: application/vnd.github+json" \
                  "$runs_endpoint" \
                  --jq "[.workflow_runs[] | select(($association_filter) and .status != \"completed\")] | length"
              )"

              if [ "$active_runs" -lt 1 ] || [ "$attempt" -eq 12 ]; then
                echo "$workflow_name has no successful completed run for $CHECKED_SHA."
                exit 1
              fi

              echo "$workflow_name is still running for $CHECKED_SHA; waiting for completion."
              sleep 5
            done
          }

          verify_workflow \
            Tests \
            ".head_sha == \"$CHECKED_SHA\"" \
            "/repos/$REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$CHECKED_SHA&per_page=100"
          verify_workflow \
            Security \
            ".event == \"workflow_run\" and .display_title == \"Security · $CHECKED_SHA\"" \
            "/repos/$REPOSITORY/actions/workflows/security.yml/runs?per_page=100"

      - name: Confirm release target is still current
        id: final-target
        if: steps.release-target.outputs.ready == 'true'
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/release
          current_sha="$(git rev-parse FETCH_HEAD)"
          checked_sha="${{ steps.checked-commit.outputs.sha }}"

          if [ "$current_sha" != "$checked_sha" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release because release moved to $current_sha while checks were running for $checked_sha."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.final-target.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        if: steps.final-target.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build
        if: steps.final-target.outputs.ready == 'true'
        run: npm run build

      - name: Prepare npm README
        if: steps.final-target.outputs.ready == 'true'
        run: cp docs/README.md README.md

      - name: Verify package contents
        if: steps.final-target.outputs.ready == 'true'
        run: npm pack --dry-run --ignore-scripts

      - name: Upload release artifact
        if: steps.final-target.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-build-${{ steps.checked-commit.outputs.sha }}
          path: |
            dist
            README.md
          if-no-files-found: error
          retention-days: 1

  oracle_thick_integration:
    name: Oracle Thick integration release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'

    services:
      oracle:
        image: gvenzl/oracle-free:23.26.0-slim-faststart@sha256:67de722693c8351cf93a602667926820376c10b3d23e283a6cdcdc50be46ec10
        env:
          ORACLE_RANDOM_PASSWORD: 'true'
          APP_USER: typeorm
          APP_USER_PASSWORD: typeorm
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60

    env:
      RUN_INTEGRATION_TESTS: '1'
      ORACLE_HOST: 127.0.0.1
      ORACLE_PORT: 1521
      ORACLE_DATABASE: FREEPDB1
      ORACLE_USERNAME: typeorm
      ORACLE_PASSWORD: typeorm

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Oracle Instant Client Basic Light
        env:
          INSTANT_CLIENT_URL: https://download.oracle.com/otn_software/linux/instantclient/2326200v2/instantclient-basiclite-linux.x64-23.26.2.0.0.zip
          EXPECTED_CKSUM: '149323083'
          EXPECTED_SIZE: '75797020'
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/instantclient-basiclite.zip"
          destination="$RUNNER_TEMP/oracle-instant-client"
          curl --fail --location --silent --show-error "$INSTANT_CLIENT_URL" --output "$archive"
          read -r actual_cksum actual_size _ < <(cksum "$archive")

          if [ "$actual_cksum" != "$EXPECTED_CKSUM" ] || [ "$actual_size" != "$EXPECTED_SIZE" ]; then
            echo "Oracle Instant Client integrity check failed: cksum=$actual_cksum size=$actual_size"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libaio1t64 unzip
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          client_dir="$(find "$destination" -mindepth 1 -maxdepth 1 -type d -name 'instantclient_*' -print -quit)"
          if [ -z "$client_dir" ]; then
            echo "Oracle Instant Client directory was not found after extraction."
            exit 1
          fi
          echo "$client_dir" | sudo tee /etc/ld.so.conf.d/oracle-instant-client.conf > /dev/null
          sudo ldconfig
          echo "ORACLE_CLIENT_LIB_DIR=$client_dir" >> "$GITHUB_ENV"

      - name: Assert Oracle Thick integration is required
        run: |
          test "$RUN_INTEGRATION_TESTS" = '1'
          test -n "$ORACLE_CLIENT_LIB_DIR"

      - name: Run Oracle Thick integration tests
        run: npx vitest run test/integration/oracle.integration.test.ts --reporter=default

  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [prepare, oracle_thick_integration]
    if: needs.prepare.outputs.ready == 'true' && needs.oracle_thick_integration.result == 'success'
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-discussions: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout verified commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: release
          token: ${{ steps.app-token.outputs.token }}

      - name: Attach release branch
        shell: bash
        run: |
          set -euo pipefail

          git checkout -B release origin/release
          git branch --set-upstream-to=origin/release release

      - name: Configure release app git auth
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling from lockfile
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: true
        run: npm ci --no-audit --no-fund

      - name: Download verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-build-${{ needs.prepare.outputs.sha }}
          path: .

      - name: Ensure release still points to the verified commit
        id: publish-target
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/release
          current_sha="$(git rev-parse FETCH_HEAD)"
          checked_sha="${{ needs.prepare.outputs.sha }}"

          if [ "$current_sha" != "$checked_sha" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release because release moved to $current_sha after preparing $checked_sha."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish release
        id: semantic-release
        if: steps.publish-target.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: true
        shell: bash
        run: |
          set -euo pipefail

          checked_sha="${{ needs.prepare.outputs.sha }}"
          current_branch="$(git branch --show-current)"

          if [ "${GITHUB_REF_NAME:-}" != "release" ] || [ "${GITHUB_REF:-}" != "refs/heads/release" ]; then
            echo "Release workflow must run with GitHub ref refs/heads/release."
            echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-}"
            echo "GITHUB_REF=${GITHUB_REF:-}"
            echo "GITHUB_REF_NAME=${GITHUB_REF_NAME:-}"
            exit 1
          fi

          if [ "$current_branch" != "release" ]; then
            echo "Expected local branch release, got: $current_branch"
            exit 1
          fi

          npm run semantic-release

          git fetch --no-tags origin refs/heads/release
          release_sha="$(git rev-parse FETCH_HEAD)"

          if [ "$release_sha" = "$checked_sha" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_parent_sha="$(git rev-parse "$release_sha^")"
          if [ "$release_parent_sha" != "$checked_sha" ]; then
            echo "release moved unexpectedly from $checked_sha to $release_sha"
            exit 1
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Open release metadata sync PR
        if: steps.semantic-release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.semantic-release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(git show "$RELEASE_SHA:package.json" | jq -r .version)"
          existing_pr="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --base master \
              --head release \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$existing_pr" ]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --base master \
              --head release \
              --title "chore(release): sync v$version metadata to master" \
              --body "Sync the package version and changelog generated by semantic-release for v$version back to master. Merge this PR with **Create a merge commit** to preserve shared branch history."
          else
            echo "Release metadata sync PR #$existing_pr is already open; its head was updated to $RELEASE_SHA."
          fi
